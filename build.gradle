plugins {
	id 'base'
	id 'org.openapi.generator' version '7.25.0'
}

repositories {
	mavenCentral()
}

dependencies {
	openApiGeneratorExtra project('generators')
}

openApiGenerate {
	generatorName = 'typescript'
	inputSpec = file('openapi.json').toString()
	outputDir = file('build/typescript').toString()
	generatorClasspath.from configurations.openApiGeneratorExtra
	cleanupOutput = true
}

tasks.register('generateSwaggerCode') {
	group = 'build'
	description = 'Generates the TypeScript SDK from the OpenAPI specification.'
	dependsOn tasks.openApiGenerate
}

build.dependsOn generateSwaggerCode

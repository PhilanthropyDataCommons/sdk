version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "America/Los_Angeles"
      time: "04:00"
  - package-ecosystem: "npm"
    directory: "/generators/src/resources/typescript"
    schedule:
      interval: "daily"
    groups:
      development:
        dependency-type: "development"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "America/Los_Angeles"
      time: "04:00"
    groups:
      github-actions:
        patterns:
          - "*"
